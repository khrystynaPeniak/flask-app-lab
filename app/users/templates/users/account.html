{% extends "base.html" %}
{% block title %}Account Profile{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center mb-0">Profile Information</h2>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-sm-3">
                            <p class="mb-0"><strong>Username:</strong></p>
                        </div>
                        <div class="col-sm-9">
                            <p class="text-muted mb-0">{{  current_user.username }}</p>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3">
                            <p class="mb-0"><strong>Email:</strong></p>
                        </div>
                        <div class="col-sm-9">
                            <p class="text-muted mb-0">{{  current_user.email }}</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col text-center">
                            <a href="{{ url_for('users.logout') }}" class="btn btn-danger">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
