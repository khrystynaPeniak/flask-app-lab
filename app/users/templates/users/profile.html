{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header">
        <h2>Профіль користувача</h2>
    </div>
    <div class="card-body">
        <h3>Вітаємо, {{ username }}!</h3>
        <p>Ви успішно увійшли.</p>
        <a href="{{ url_for('users.logout') }}" class="btn btn-danger">Logout</a>
    </div>
</div>

{% endblock %}
