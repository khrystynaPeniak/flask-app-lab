{% extends 'base.html' %}

{% block title %} POSTS {% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Post № {{post["id"]}} - {{post["title"]}} </h1>

    <div class="card-body">
        <div class="mb-4">
            <p>{{ post.content }}</p>
        </div>

        <div class="text-muted">
            <small>
                <i class="bi bi-folder"></i> {{ post.category }} |
                <i class="bi bi-person"></i> {{ post.author }} |
                <i class="bi bi-calendar"></i> {{ post.date_posted }}
            </small>
        </div>

    </div>
    <div class="mt-3">
    <a href="{{ url_for("posts.get_posts") }}" class="btn btn-dark">Return posts</a>

    <form action="{{ url_for('posts.delete_post', id=post.id) }}" method="POST" class="d-inline">
        <button type="submit" class="btn btn-danger">Delete Post</button>
    </form>

    <a href="{{ url_for('posts.edit_post', post_id=post.id) }}" class="btn btn-primary">Edit Post</a>
</div>
</div>
{% endblock %}
